# Runs the owner's verification protocol on every push to the working branch.
#
# `npm run verify` writes verify-report.md (one line per requirement: PASS / FAIL / NOT TESTED and
# why), screenshots/<milestone>/ at 360 px and 1440 px, and verify-output.zip. All three are
# uploaded as artifacts even when the run fails, and the report is also echoed into the job summary
# so it can be read without downloading anything.
#
# STRICT: the verify step runs with VERIFY_STRICT=1 and a second step re-reads the report, so a green
# check on this workflow means every requirement was proven — not merely that nothing complained. A run
# with any NOT TESTED requirement fails, and still commits the report that explains why.
#
# Scope: this workflow is deliberately limited to the session branch. It never runs on main, never
# pushes, never opens a pull request and never deploys. Permissions are read-only.
name: verify

on:
  push:
    branches:
      - arena/c33e6ed1-diction
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: Also commit the 360/1440 screenshots to the branch (they are several MB)
        type: boolean
        default: false

permissions:
  # read to check out; write only so the last step can commit the text evidence back to this branch
  # (artifacts and logs live on hosts this project's agent sandbox cannot reach, so the report is
  # committed instead of only uploaded). The commit message carries [skip ci] to avoid a loop.
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache the disposable MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-memory-server
          key: mongod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongod-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      - name: Run npm run verify
        env:
          # Strict: a NOT TESTED requirement fails this job. Without it the exit code is non-zero only
          # when something FAILED, which is how wave A's first run came back green with 18 requirements
          # never proven (test mode died before the typecheck, the build and the database).
          VERIFY_STRICT: '1'
        run: npm run verify

      - name: Fail unless the report says every requirement was proven
        # Independent of the exit code above: if the report is missing, or its Result line is anything
        # but PASS, the check goes red even if `npm run verify` somehow exited 0. The evidence steps
        # below run on `always()`, so the report that explains the failure is still committed.
        run: |
          set -e
          if [ ! -f verify-report.md ]; then
            echo "::error::verify-report.md was not written — nothing was proven."
            exit 1
          fi
          result=$(grep -m1 '^## Result:' verify-report.md || true)
          echo "$result"
          case "$result" in
            '## Result: **PASS**'*) ;;
            *) echo "::error::CI is strict — the report is not PASS: ${result:-no Result line}"; exit 1 ;;
          esac
          case "$result" in
            *'0 NOT TESTED'*) ;;
            *) echo "::error::CI is strict — some requirements were NOT TESTED: $result"; exit 1 ;;
          esac
          echo "Every requirement was proven on this run."

      - name: Show the report in the job log and summary
        if: always()
        run: |
          echo "----- verify-report.md -----"
          cat verify-report.md || echo "(no report was written)"
          {
            echo "## Verification report"
            echo ""
            cat verify-report.md || echo "_No report was written — see the log above._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report and step logs back to this branch
        if: always()
        env:
          PUBLISH_SCREENSHOTS: ${{ inputs.publish_screenshots }}
        run: |
          set -e
          mkdir -p test-results/ci-latest/logs
          cp -f verify-report.md test-results/ci-latest/verify-report.md
          # Keep the committed logs small: the last 400 lines of each step is enough to diagnose.
          for f in verify-output/logs/*.txt; do
            [ -e "$f" ] || continue
            tail -n 400 "$f" > "test-results/ci-latest/logs/$(basename "$f")"
          done
          # next build rewrites this generated file; restore it so the tree is clean for the rebase.
          git checkout -- next-env.d.ts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-report.md test-results/ci-latest
          if [ "$PUBLISH_SCREENSHOTS" = "true" ]; then git add -f screenshots || true; fi
          if git diff --cached --quiet; then echo "Evidence unchanged; nothing to commit."; exit 0; fi
          git commit -m "ci: verification evidence for ${GITHUB_SHA:0:7} [skip ci]"
          # Test runs can leave tracked files touched (generated next-env, published screenshots);
          # the evidence is committed already, so discard the churn before rebasing.
          git checkout -- screenshots next-env.d.ts 2>/dev/null || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload report, screenshots and verify-output.zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            verify-report.md
            verify-output.zip
            screenshots/
            verify-output/logs/
          if-no-files-found: warn
          retention-days: 30
